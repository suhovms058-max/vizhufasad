name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check server
        working-directory: server
        run: |
          npm ci
          npm run check

      - name: Validate database migrations
        working-directory: server
        run: npm run db:check

      - name: Start data infrastructure
        run: |
          docker compose up -d
          init_id="$(docker compose ps -a -q minio-init)"
          for attempt in $(seq 1 60); do
            init_status="$(docker inspect --format '{{.State.Status}}' "$init_id")"
            if [ "$init_status" = "exited" ]; then
              test "$(docker inspect --format '{{.State.ExitCode}}' "$init_id")" = "0"
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          docker compose up -d --wait postgres redis minio

      - name: Migrate, seed and test server
        working-directory: server
        env:
          DATABASE_URL: postgresql://vizhufasad:vizhufasad_local@127.0.0.1:5432/vizhufasad
          REDIS_URL: redis://127.0.0.1:6379
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: vizhufasad
          S3_SECRET_ACCESS_KEY: vizhufasad_local_secret
          S3_BUCKET: vizhufasad-private
          S3_FORCE_PATH_STYLE: "true"
        run: |
          npm run db:setup
          npm test
          npm run smoke:infra

      - name: Install browser for the Standard user-flow test
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Test the Standard user flow at supported viewports
        working-directory: server
        run: npm run test:e2e

      - name: Stop data infrastructure
        if: always()
        run: docker compose down --volumes

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /vizhufasad
          NEXT_PUBLIC_LEADS_API_URL: https://89-23-97-248.sslip.io/api/leads
          NEXT_PUBLIC_APP_URL: https://89-23-97-248.sslip.io/app/new
          NEXT_PUBLIC_LEGACY_LEADS_ENABLED: "false"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
