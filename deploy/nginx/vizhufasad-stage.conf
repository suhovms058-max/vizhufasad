server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vizhufasad.ru;

    ssl_certificate /etc/letsencrypt/live/46-149-67-190.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46-149-67-190.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "VIZHUFASAD staging";
    auth_basic_user_file /etc/nginx/vizhufasad-stage.htpasswd;

    root /opt/vizhufasad-stage/out;
    index index.html;

    # Robokassa must reach signed server callbacks without staging credentials.
    location = /api/payments/webhooks/robokassa/result {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/payments/webhooks/robokassa/result2 {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public legal pages are required before payment activation.
    location ^~ /legal/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The product has its own email-code authentication. Public user routes
    # must reach Express; internal diagnostics remain behind staging Basic Auth.
    location ~ ^/(app|api|assets|auth|login)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|internal)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_basic off;
        try_files $uri $uri/ /index.html;
    }
}

# Isolated preview of the Stage 13 redesign. It uses a separate static root,
# API process and environment file, so publishing here cannot replace the
# current vizhufasad.ru application.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 46-149-67-190.sslip.io;

    ssl_certificate /etc/letsencrypt/live/46-149-67-190.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46-149-67-190.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/vizhufasad-stage13/out;
    index index.html;
    client_max_body_size 1m;

    # Payment callbacks belong only to production.
    location ~ ^/api/payments/webhooks/robokassa/ {
        return 404;
    }

    location ^~ /legal/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(app|api|assets|auth|login)(/|$) {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|internal)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storage-46-149-67-190.sslip.io;

    ssl_certificate /etc/letsencrypt/live/46-149-67-190.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46-149-67-190.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
