server {
    listen 80;
    listen [::]:80;
    server_name 46-149-67-190.sslip.io;

    auth_basic "VIZHUFASAD staging";
    auth_basic_user_file /etc/nginx/vizhufasad-stage.htpasswd;

    root /opt/vizhufasad-stage/out;
    index index.html;

    location ~ ^/(app|api|health|internal|assets)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name storage-46-149-67-190.sslip.io;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
