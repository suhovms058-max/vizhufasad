server {
    listen 80;
    listen [::]:80;
    server_name vizhufasad.ru www.vizhufasad.ru;
    return 301 https://vizhufasad.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vizhufasad.ru;

    ssl_certificate /etc/letsencrypt/live/vizhufasad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vizhufasad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vizhufasad.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vizhufasad.ru;

    ssl_certificate /etc/letsencrypt/live/vizhufasad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vizhufasad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/vizhufasad-current/out;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/payments/webhooks/robokassa/result {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location = /api/payments/webhooks/robokassa/result2 {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location ~ ^/(health|internal)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location ^~ /legal/ {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location ~ ^/(app|api|assets|auth|login)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
